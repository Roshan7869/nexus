name: NEXUS P5 Ops Eval

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_ab:
        description: "Run full 20-query A/B suite (slow)"
        required: false
        default: "false"

jobs:
  ops-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest || true

      - name: Unit + ops gates
        run: |
          chmod +x scripts/ci_eval.sh
          # Skip AB by default in PR CI (needs embeddings model)
          bash scripts/ci_eval.sh

      - name: Upload ops report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-eval-report
          path: logs/ops_eval_ci.json
          if-no-files-found: ignore
