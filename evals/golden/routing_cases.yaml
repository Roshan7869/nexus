# NEXUS golden routing cases — CURATED 2026-09-25 (Phase 0, okf-native-cordis)
#
# Schema (frozen; add instances, never fields):
#   id:              unique string
#   prompt:          the task text handed to route_for_task / retrieve_chunks
#   expect_skills:   any of these skill/resource names must appear in top-k
#                    (omit => no skill assertion; empty list is invalid)
#   accept_clusters: router's top cluster must be one of these; in retrieval-arm
#                    mode it is the cluster filter passed to retrieve_chunks
#                    (omit => no cluster check / no filter)
#   expect_tier:     router tier integer (omit => no check)
#   top_k:           how many top skills to consider for expect_skills (default 5)
#   tags:            free-form
#
# Curation (2026-09-25): merged 5 seed + 4 draft sets (drafts archived, not
# deleted). Validation run: 105/105 ids unique, 0 stale skill refs (all
# expect_skills exist AND status=active), 0 unknown clusters, 1 fix applied:
#   - reasoning-sec-cve-blast-radius-014: accept_clusters omitted the clusters
#     of ALL expect_skills (analyzer_planner/general) -> unsatisfiable under a
#     cluster filter; added them.
# OOD cases: expect_skills omitted => health-only assertions (recall not
# defined; runner records them as health, excluded from recall/MRR).

