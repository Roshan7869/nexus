# NEXUS Second Brain v2 — Gap → Research → Algorithm → Best-Fit Map
# Generated: 2026-07-11
# Method: first principles + GitNexus code graph + arXiv/SSRN literature
# Companion: docs/research/ADR-002-research-authority-second-brain-v2.md
#
# Scoring dimensions (0–10 each):
#   fit_codebase   — reuses existing NEXUS modules / flags
#   research_strength — empirical or theoretical backing
#   perf_upside    — expected routing/learning quality gain
#   cost_latency   — lower score = more expensive/slow
#   blast_radius   — lower score = riskier change
#   implement_hours — effort estimate (informational)
# best_fit = weighted: fit*0.3 + research*0.25 + perf*0.25 + (10-cost)*0.1 + (10-blast)*0.1

meta:
  branch: second-brain-v2
  gitnexus_repo: nexus
  live_db_state: "CRITICAL — 1 resource; full brain in backups"
  production_router_default: "USE_UNIFIED_ROUTER=0 → route_task (v4)"
  blend_weights: {iso: 0.40, thompson: 0.15, efc: 0.25, ucb: 0.20}
  rrf_k: 60
  iso_theta_paper: 0.28
  efc_formula: "EFC_t = κ · I · V · R · M  (κ=10, arXiv:2605.29682)"

# ═══════════════════════════════════════════════════════════════════════════
# FIRST PRINCIPLES (irreducible atoms)
# ═══════════════════════════════════════════════════════════════════════════
first_principles:
  A1_registry:
    what: "Authoritative set of skills/tools with embeddings, clusters, edges"
    failure: "Empty or desynced registry → all routing is noise"
  A2_retrieve:
    what: "Map task text → ranked resource candidates"
    failure: "Wrong candidates → wrong tools in context"
  A3_rank:
    what: "Multi-signal score (semantic + learn + explore)"
    failure: "Exploit-only or explore-only → local optima or thrash"
  A4_gate:
    what: "Only allowlisted active tools may execute"
    failure: "Tool hallucination / schema tax / lost-in-middle"
  A5_feedback:
    what: "Outcomes update beliefs with quality weights"
    failure: "No learning; priors never improve"
  A6_serve:
    what: "Process lifecycle: one warm brain, stable MCP/HTTP"
    failure: "Locks, cold starts, env skew, zombie processes"

# ═══════════════════════════════════════════════════════════════════════════
# P0 — DATA & RUNTIME INTEGRITY
# ═══════════════════════════════════════════════════════════════════════════
gaps:
  G1:
    title: "Live DB empty (1 resource vs ~2.8k in backups)"
    priority: P0
    atoms: [A1_registry]
    causes:
      root: "Working tree db/nexus.db is a slim/corrupt cut; full state lives in timestamped backups"
      gitnexus_evidence:
        - "HTTP /stats reports resources.skill=1"
        - "test_cluster_membership_populated fails: count=0"
      code_evidence:
        - "server/db.py DEFAULT_DB_PATH = ~/nexus/db/nexus.db"
        - "server/nexus_http_daemon.py hardcodes Path.home()/nexus/db/nexus.db"
      backups:
        pre_cutover: {path: "db/nexus.db.pre-cutover-1782612021", resources: 2821, edges: 9283, efc_cols: true}
        pre_restore: {path: "db/nexus.db.pre-restore.1782906626", resources: 2842, edges: 5, chunks: 88354}
        pre_efc: {path: "db/nexus.db.pre-efc-backup-20260626-210021", resources: 2815, edges: 9126}
    papers:
      - {id: "arXiv:2506.16051", title: "Data-centric infrastructure for reproducible ML", role: "version Dataset/Execution/Asset"}
      - {id: "arXiv:2509.00293", title: "SmartDiff large-scale data difference analysis", role: "migration validation gates"}
      - {id: "arXiv:2406.09737", title: "MLOps multivocal review", role: "data quality SLOs"}
    algorithms:
      - name: "Versioned restore with validation gate"
        components: [snapshot_current, select_backup, atomic_swap, count_gate, health_probe]
        pseudocode: |
          1. COPY live → db/nexus.db.empty-YYYYMMDD
          2. score backups by (resources, edges, efc_cols, embeddings)
          3. prefer pre-cutover (edges+EFC) OR pre-restore then re-densify
          4. stop daemons; cp backup → nexus.db; run migrations
          5. GATE: resources>=2000 AND efc_cols present AND embeddings>0
    candidates:
      - id: R1a
        name: "Restore pre-cutover (best graph)"
        scores: {fit_codebase: 10, research_strength: 8, perf_upside: 10, cost_latency: 2, blast_radius: 8, hours: 1}
      - id: R1b
        name: "Restore pre-restore (max rows, re-densify edges)"
        scores: {fit_codebase: 9, research_strength: 8, perf_upside: 9, cost_latency: 4, blast_radius: 8, hours: 3}
      - id: R1c
        name: "Re-ingest from zero"
        scores: {fit_codebase: 5, research_strength: 6, perf_upside: 7, cost_latency: 9, blast_radius: 6, hours: 20}
    best_fit: R1a
    rationale: "Maximize knowledge density immediately; edges already densified; lowest hours"
    adopt:
      - "Out-of-session restore from pre-cutover"
      - "Publish resource_count / edge_count as health SLO"
      - "Never gitignore-away the only copy of production brain"

  G2:
    title: "Schema drift — outcome_log missing EFC columns on live"
    priority: P0
    atoms: [A1_registry, A5_feedback]
    causes:
      root: "Live DB recreated/migrated without EFC ALTERs; schema.sql lags code"
      code_evidence:
        - "learning._bridge_outcome_log INSERT lists efc_informativeness..efc_score"
        - "db/schema.sql has NO efc_* columns"
        - "Live PRAGMA outcome_log: no efc cols; backups have 5 EFC cols"
    papers:
      - {id: "arXiv:2506.16051", title: "Data-centric dual domain/ML schema", role: "contract = code"}
      - {id: "arXiv:2512.09762", title: "Operation-based data versioning", role: "migrations as ops"}
      - {id: "arXiv:2605.29682", title: "EFC scaling laws (in efc.py header)", role: "column semantics"}
    algorithms:
      - name: "EFC event compute (already in server/efc.py)"
        formula: "EFC_t = 10 * I * V * R * M"
        components:
          I: "informativeness from outcome label"
          V: "validity proxy"
          R: "1 - min(repeats_1h/10, 0.9)"
          M: "1.0 first-use else 0.5"
        nrs: "nrs_efc = efc * Q_nr * G_nr * Λ / (1 + 0.35*A_t)"
      - name: "Boot-time schema gate"
        components: [pragma_check, apply_migrations, fail_closed]
    candidates:
      - id: R2a
        name: "Restore full DB (inherits EFC cols) + fix schema.sql"
        scores: {fit_codebase: 10, research_strength: 9, perf_upside: 8, cost_latency: 2, blast_radius: 7, hours: 1}
      - id: R2b
        name: "ALTER live only (empty brain still useless)"
        scores: {fit_codebase: 7, research_strength: 7, perf_upside: 2, cost_latency: 1, blast_radius: 4, hours: 0.5}
    best_fit: R2a
    rationale: "Schema alone without data is theater; restore+contract update is the fix"
    adopt:
      - "Daemon startup: require efc_score column or refuse /report_outcome"
      - "Sync db/schema.sql to live+migrations"

  G3:
    title: "FAISS / embedding desync (index present, embeddings=0)"
    priority: P0
    atoms: [A1_registry, A2_retrieve]
    causes:
      root: "Index file left from prior full corpus; live resources table emptied"
      code_evidence:
        - "tool_attention_v4 / NumpyRouter load embeddings from DB"
        - "test_v3: NumpyRouter: no routable embeddings found"
        - "db/faiss/resources.index ~3.2MB still on disk"
    papers:
      - {id: "arXiv:2604.13728", title: "Hybrid RRF dense/sparse", role: "rebuild both channels"}
      - {id: "arXiv:2511.10297", title: "Local hybrid RAG", role: "FAISS+sparse consistency"}
      - {id: "Cormack SIGIR 2009", title: "RRF k=60", role: "fusion after rebuild"}
    algorithms:
      - name: "Atomic embed→store→index rebuild"
        components: [encode_all_MiniLM_L6_v2, write_resource_embeddings, faiss_or_numpy_matrix, checksum]
        gate: "len(ids)==n_vectors && max(|id_set Δ index_ids|)=0"
    candidates:
      - id: R3a
        name: "Restore DB with embeddings then verify NumpyRouter load"
        scores: {fit_codebase: 10, research_strength: 9, perf_upside: 10, cost_latency: 3, blast_radius: 6, hours: 2}
      - id: R3b
        name: "Full re-embed from body_text"
        scores: {fit_codebase: 8, research_strength: 8, perf_upside: 9, cost_latency: 7, blast_radius: 5, hours: 8}
    best_fit: R3a
    rationale: "pre-cutover already has 1834 embeddings; re-embed only if checksum fails"
    adopt:
      - "scripts/rebuild_faiss.py or NumpyRouter warm path after restore"
      - "Health: embedding_count == routable_resource_count (or report ratio)"

  G4:
    title: "HTTP daemon runs system Python not venv"
    priority: P0
    atoms: [A6_serve]
    causes:
      root: "Process started outside supervisord.conf which specifies venv/bin/python3"
      code_evidence:
        - "supervisord.conf command=.../venv/bin/python3 ... nexus_http_daemon.py"
        - "live pid uses /usr/bin/python3"
    papers:
      - {id: "arXiv:2602.10479", title: "Agentic AI software architecture", role: "control plane separation"}
      - {id: "arXiv:2503.06705", title: "Self-adaptive cloud reliability", role: "supervised restarts"}
    algorithms:
      - name: "Single control-plane spawn"
        components: [supervisord, venv_only, program_priority, autorestart]
    best_fit: R4a
    candidates:
      - id: R4a
        name: "Apply supervisord out-of-session (venv both MCP+HTTP)"
        scores: {fit_codebase: 10, research_strength: 8, perf_upside: 6, cost_latency: 1, blast_radius: 7, hours: 0.5}
    adopt:
      - "Never start daemon with system python"
      - "supervisorctl status as ops gate"

  G5:
    title: "DB locks from processes + ad-hoc root tests"
    priority: P0
    atoms: [A6_serve]
    causes:
      root: "Long-lived writers + root tests open live nexus.db without isolation"
      code_evidence:
        - "test_epsilon/degradation/edges: database is locked"
        - "daemon timeout=60 WAL; tests not using fixtures"
    papers:
      - {id: "arXiv:2602.07147", title: "Microservices anti-patterns / bulkheads", role: "isolate test vs prod"}
      - {id: "arXiv:2602.10479", title: "Circuit breakers / budgets", role: "fail soft under contention"}
    algorithms:
      - name: "Bulkhead DBs"
        components: [prod_db, test_tmp_db, short_tx, busy_timeout, no_root_tests_on_live]
    best_fit: R5a
    candidates:
      - id: R5a
        name: "Fixture-only unit tests; move root tests under tests/ with tmp db"
        scores: {fit_codebase: 9, research_strength: 8, perf_upside: 4, cost_latency: 2, blast_radius: 3, hours: 4}
    adopt:
      - "pytest always uses tmp_path DB"
      - "prod: WAL + busy_timeout + single writer preference"

  G6:
    title: "MCP transport flaky (handshake broken pipe)"
    priority: P0
    atoms: [A6_serve]
    causes:
      root: "Multiple owners of MCP lifecycle; session death not supervised"
      code_evidence:
        - "Grok MCP nexus handshake failed broken pipe"
        - "MCP process may exist but stdio transport dead"
    papers:
      - {id: "arXiv:2602.10479", title: "Control plane + circuit breakers", role: "safe restart"}
      - {id: "arXiv:2510.13467", title: "NetMCP SONAR", role: "health-aware MCP routing"}
    algorithms:
      - name: "Health-probed MCP spawn"
        components: [supervisor_program, stdio_heartbeat, client_reconnect, single_owner]
    best_fit: R6a
    candidates:
      - id: R6a
        name: "Supervisord-owned MCP + client reconnect policy"
        scores: {fit_codebase: 9, research_strength: 7, perf_upside: 5, cost_latency: 2, blast_radius: 6, hours: 2}
    adopt:
      - "One process owner; kill orphans before restart"
      - "Document reconnect for IDE clients"

  # ═══════════════════════════════════════════════════════════════════════
  # P1 — ROUTING CUTOVER
  # ═══════════════════════════════════════════════════════════════════════
