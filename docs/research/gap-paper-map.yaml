# ═══════════════════════════════════════════════════════════════════════════
# CANONICAL ALGORITHM STACK (production SoT)
# ═══════════════════════════════════════════════════════════════════════════
production_stack:
  retrieve:
    steps:
      - "optional cluster prefilter (MCP-Zero / AnyTool style)"
      - "lexical FTS5 + dense bit/vec"
      - "RRF k=60 (Cormack)"
      - "4-term blend 0.40/0.15/0.25/0.20"
      - "two-tier cold_fraction=0.3 UCB"
      - "ISO θ adaptive/paper 0.28 filter"
      - "top_k=8..12 lazy schemas (Tool Attention)"
  execute:
    steps:
      - "HallucinationGate + active-set intersection"
      - "preconditions GLOBAL_GATES"
  learn:
    steps:
      - "routing_log open → outcome → record_outcome"
      - "EFC_t=κIVRM bridge to outcome_log"
      - "Thompson Beta update"
      - "optional Reflexion on wrong/partial"
  serve:
    steps:
      - "supervisord venv MCP + HTTP daemon"
      - "brain_health_gate before traffic"

anti_patterns:
  - "Dumping full MCP tool catalog into context (Lost in the Middle)"
  - "Silent except:pass on learning path"
  - "Running HTTP with system Python"
  - "Treating empty DB as healthy because /health status=ok"
  - "Flipping USE_UNIFIED_ROUTER=2 without A/B suite"
  - "Fake outcomes without reflexion/perplexity scorers"
  - "O(n²) full pairwise KG without FAISS NN"
