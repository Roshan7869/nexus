; ============================================================================
; NEXUS Second Brain — supervisord config (Plan Phase 1, process supervision)
; ============================================================================
; Adopted from NEXUS_SECOND_BRAIN_PLAN_v2.md §Phase 1. Two adjustments from
; first principles vs. the plan's draft:
;   1. command= uses venv/bin/python3 (NOT system python3). The live MCP and
;      HTTP daemon require deps (supervisor, sentence-transformers, fastapi,
;      python-louvain, numpy) that live ONLY in the venv. System python3 has
;      none of them — supervisord would spawn processes that crash on import.
;   2. Added [inet_http_server]/[supervisorctl]/[rpcinterface:supervisor]
;      sections so `supervisorctl status` (plan step 121) and the XML-RPC
;      control block (plan step 3) actually work. The plan's draft omitted
;      these, leaving supervisorctl unable to connect.
;
; APPLYING THIS CONFIG RESTARTS THE LIVE MCP — out-of-session operation only
; (per guardrail: never kill the live MCP from inside a session). To apply:
;   pkill -f "nexus-mcp-enhanced.py" && pkill -f "nexus_http_daemon"
;   venv/bin/supervisord -c /home/roshan/nexus/supervisord.conf
;   venv/bin/supervisorctl status
; Rollback: venv/bin/supervisorctl shutdown ; revert to direct venv/bin/python3.
; ============================================================================

[unix_http_server]
file=/home/roshan/nexus/run/supervisor.sock
chmod=0700

[inet_http_server]
port=127.0.0.1:9001

[supervisord]
logfile=/home/roshan/nexus/logs/supervisord.log
pidfile=/home/roshan/nexus/run/supervisord.pid
nodaemon=false
childlogdir=/home/roshan/nexus/logs
minfds=1024

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/roshan/nexus/run/supervisor.sock

; ── HTTP daemon (FastAPI bridge) — priority 10 ─────────────────────────────
; Gap 2: PRIMARY OWNER = systemd user unit nexus-daemon.service (:8080).
; autostart=false — STOPPED here is intentional (avoid dual-parent / port bind).
; Only flip autostart=true after systemctl --user stop nexus-daemon (out of session).
[program:nexus-http-daemon]
command=/home/roshan/nexus/venv/bin/python3 /home/roshan/nexus/server/nexus_http_daemon.py
directory=/home/roshan/nexus
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
killasgroup=true
stopasgroup=true
environment=PYTHONPATH="/home/roshan/nexus:/home/roshan/nexus/server",NEXUS_CLUSTER_ROUTING="true",NEXUS_THOMPSON_ROUTING="true",NEXUS_REFLECTION="true",NEXUS_DB_PATH="/home/roshan/nexus/db/nexus.db",USE_UNIFIED_ROUTER="2",NEXUS_IDE="http"
stdout_logfile=/home/roshan/nexus/logs/http-daemon.log
stderr_logfile=/home/roshan/nexus/logs/http-daemon.err
priority=10

; ── MCP server (stdio MCP) — priority 20 ──────────────────────────────────
; Gap 2: PRIMARY OWNER = IDE/host via .mcp.json (stdio pipe).
; autostart=false — STOPPED here is intentional. Do NOT start under supervisor
; while Claude Code / OpenCode own the stdio session.
[program:nexus-mcp-server]
command=/home/roshan/nexus/venv/bin/python3 /home/roshan/nexus/server/nexus-mcp-enhanced.py
directory=/home/roshan/nexus
numprocs=1
autostart=false
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/home/roshan/nexus:/home/roshan/nexus/server",NEXUS_CLUSTER_ROUTING="true",NEXUS_THOMPSON_ROUTING="true",NEXUS_REFLECTION="true",NEXUS_DB_PATH="/home/roshan/nexus/db/nexus.db",USE_UNIFIED_ROUTER="2",NEXUS_IDE="claude-code"
stdout_logfile=/home/roshan/nexus/logs/mcp-server.log
stderr_logfile=/home/roshan/nexus/logs/mcp-server.err
priority=20

; ── Dashboard server (port 8765) — start third (priority 30) ──────────────
[program:nexus-dashboard]
command=/home/roshan/nexus/venv/bin/python3 /home/roshan/nexus/server/dashboard/server.py
directory=/home/roshan/nexus
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=5
killasgroup=true
stopasgroup=true
stdout_logfile=/home/roshan/nexus/logs/dashboard.log
stderr_logfile=/home/roshan/nexus/logs/dashboard.err
priority=30

; ── Context-harness MCP (optional dual path) — priority 40 ────────────────
; Gap 2: PRIMARY OWNER = in-process harness_mcp_bridge on main NEXUS MCP.
; Separate stdio process is optional; autostart=false / STOPPED is intentional.
[program:nexus-context-harness]
command=/home/roshan/nexus/venv/bin/python3 /home/roshan/nexus/server/context_harness/server.py
directory=/home/roshan/nexus
numprocs=1
autostart=false
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PYTHONPATH="/home/roshan/nexus",NEXUS_DB_PATH="/home/roshan/nexus/db/nexus.db"
stdout_logfile=/home/roshan/nexus/logs/context-harness.log
stderr_logfile=/home/roshan/nexus/logs/context-harness.err
priority=40

; Phase 8 / Gap 2: only nexus-dashboard is meant to autostart under supervisor.
; MCP = IDE stdio, HTTP = systemd, harness = MCP bridge. See docs/process_topology.md.
; USE_UNIFIED_ROUTER=2 is set on MCP/HTTP env blocks for when they are enabled.
[program:nexus-router-env]
command=/bin/sh -c 'echo "USE_UNIFIED_ROUTER=2 (production v5) — apply via supervisorctl restart nexus-mcp-server"'
autostart=false
startsecs=0
priority=5