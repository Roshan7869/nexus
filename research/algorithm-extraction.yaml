## Paper 5: ScaleMCP (arXiv: 2505.06416)

### Core Algorithm: TDWA Embedding + Dynamic Sync

**Section:** Section 3.1, 3.2

**Tool Document Weighted Average (TDWA):**
```
Standard: emb(tool_doc) = mean(embeddings of all tokens)

TDWA:
1. Parse tool document into components:
   - tool_name (highest weight: w1=2.0)
   - synthetic_questions (high weight: w2=1.5)
   - description (normal weight: w3=1.0)
   - parameters (low weight: w4=0.5)

2. emb_components = [encode(component) for each]
3. weighted_emb = Σ(w_i * emb_components[i]) / Σ(w_i)
4. final_emb = L2_normalize(weighted_emb)
```

**CRUD Sync Pipeline:**
```
CREATE: new_tool_detected → add to vector index
READ:   tool_retrieved → merge with MCP server schema
UPDATE: tool_schema_changed → re-index with new embedding
DELETE: tool_removed_from_MCP → remove from vector index

Trigger: MCP server change event OR polling interval (configurable)
```

**Evaluation:**
- 5,000 financial metric MCP servers
- 10 LLM models, 5 embedding models, 5 retriever types
- Significant improvements in tool retrieval and agent invocation