## Paper 2: AnyTool (arXiv: 2402.04253)

### Core Algorithm: Hierarchical Tool Retrieval + Self-Reflection

**Section:** Section 3.1, 3.2

**3-Layer Architecture:**

```
Layer 1 — Category Retriever:
1. Query embedding = encode(user_query)
2. category_scores = cosine_similarity(query_emb, category_embeddings)
3. top_k_categories = argtopk(category_scores, k=3)

Layer 2 — Tool Retriever (per category):
4. FOR each category in top_k_categories:
     tool_candidates = fetch_tools_in_category(category)
     tool_scores = cosine_similarity(query_emb, tool_embeddings[tool_candidates])
     top_tools[category] = argtopk(tool_scores, k=5)

Layer 3 — Solver + Self-Reflection:
5. solver_prompt = build_prompt(query, top_tools)
6. LLM selects tool_from_top_tools
7. Execute tool
8. IF execution fails OR response unsatisfying:
     GOTO step 5 with reflection (max 3 retries)
```

**Self-Reflection Loop:**
```
WHILE attempts < max_retries:
  result = execute(selected_tool, args)
  IF result.successful AND result.satisfies(query):
    RETURN result
  reflection = LLM.analyze(result, query)
  selected_tool, args = LLM.select_next_from_candidates(reflection)
  attempts += 1
RETURN failure
```

**Key Metrics:**
- 16,000+ APIs from Rapid API
- Hierarchical reduces search space by ~95%
- Self-reflection achieves +35.4% pass rate vs ToolLLM

