## Paper 4: HuggingGPT (arXiv: 2303.17580)

### Core Algorithm: 4-Stage Orchestration

**Section:** Section 3.2

**Workflow:**
```
Stage 1 — Task Planning:
1. Parse user request into structured subtasks
2. LLM outputs: [{"task": "task_name", "dep": [dep_task_ids], "args": {...}}]

Stage 2 — Model Selection:
3. FOR each task:
     available_models = list_from_HF(model_repository)
     model_desc = get_model_description(model)
     match_score = LLM.select(model_desc, task.requirements)
     selected_models[task] = argmax(match_score)

Stage 3 — Task Execution:
4. FOR each task in dependency_order:
     model = selected_models[task]
     inputs = gather_outputs(task.dep)
     result = model.execute(inputs)
     store_result(task.id, result)

Stage 4 — Response Synthesis:
5. LLM aggregates all results into coherent response
```

