# NEXUS v2 Research Implementation — Algorithm Extraction

## Paper 1: ToolkenGPT (arXiv: 2305.11554)

### Core Algorithm: Toolken Embedding

**Section:** Section 3

**Pseudocode:**
```
Input: query, tool_set = {tool_1, tool_2, ..., tool_n}
Output: selected_tool, arguments

1. FOR each tool in tool_set:
     toolken[tool] = embedding_lookup(tool)  # Pre-computed via fine-tuning
2. tool_probs = softmax(LLM(query) @ toolken^T / τ)
3. selected_tool = argmax(tool_probs)
4. LLM generates arguments for selected_tool
5. Execute tool with arguments
```

**Key Equations:**
- Tool probability: P(tool_k) = softmax(h · e_k / τ)
  - h = LLM hidden state
  - e_k = toolken embedding for tool k
  - τ = temperature (default: 1.0)

**Implementation Details:**
- Toolkens learned via gradient descent on tool demonstration data
- LLM remains frozen; only toolken embeddings trainable
- Supports N tools by adding N new embedding vectors
- Tool selection is a single forward pass through softmax

