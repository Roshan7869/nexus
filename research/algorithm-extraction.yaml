## Paper 3: Tool-to-Agent Retrieval (arXiv: 2511.01854)

### Core Algorithm: Joint Tool-Agent Vector Space

**Section:** Section 3

**Key Innovation:**
```
Standard approach:
  Query → Agent embeddings only → Agent → (all tools) → Context dilution

Tool-to-Agent approach:
  Query → Tool embeddings → Metadata traversal → Agent → Joint representation
```

**Algorithm:**
```
1. Encode each tool: tool_emb = encoder(tool_description, tool_schema)
2. Encode each agent: agent_emb = encoder(agent_capabilities, parent_tools)
3. Store in joint index: {tool_emb, parent_agent_id, metadata}

Query-time:
4. query_emb = encode(user_query)
5. tool_matches = vector_search(query_emb, top_k=10)
6. FOR each tool_match:
     agent_id = metadata[tool_match].parent_agent_id
     agent_emb = lookup(agent_id)
     combined_score = α * tool_similarity + (1-α) * agent_similarity
7. Rerank by combined_score
8. Return top tools with full agent context
```

**Results:**
- Recall@5: 0.83 (+19.4% over baseline)
- nDCG@5: +17.7% improvement

