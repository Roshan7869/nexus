# NEXUS resource source registry.
#
# Every `resources.repo_name` in the DB must map to a fetchable upstream for
# "update to latest" to mean anything. Without this file NEXUS can only hold
# snapshots: nothing records where a resource came from, so nothing can refresh.
#
# status:
#   tracked   - local clone exists; `scripts/update_resources.py` pulls + re-absorbs
#   clonable  - upstream verified; `--clone <name>` fetches and absorbs it
#   untracked - no verified upstream; needs a URL from the user
#   protected - local tree with uncommitted work; fetched only, never pulled
#
# `resources` counts are informational (recorded 2026-11-18).
