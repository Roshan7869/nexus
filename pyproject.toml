[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.2.0"
description = "NEXUS Second Brain — self-learning resource router for AI coding agents"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Roshan"},
]
readme = "README.md"

# Runtime dependencies — keep in sync with requirements.txt
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.0",
    "python-louvain>=0.16",
    "sqlite-vec>=0.1.0",
    "fastmcp>=0.2.0",
    "mcp>=1.0.0",
    "asyncio-mqtt>=0.16.0",
    "tenacity>=8.2.0",
    "ollama>=0.2.0",
    "litellm>=1.40.0",
    "openai>=1.30.0",
    "pyyaml>=6.0.0",
    "supervisor>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nexus = "core.server:main"
nexus-mcp = "server.nexus_mcp_enhanced:main"
nexus-http = "server.nexus_http_daemon:main"
nexus-dashboard = "server.dashboard.server:main"
nexus-harness = "server.context_harness.server:main"

[tool.setuptools]
package-dir = {"" = "."}

# Tell setuptools to find all .py files under these roots
[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "server*",
    "server.*",
    "providers*",
    "scripts*",
    "tests*",
]
exclude = [
    "venv*",
    ".venv*",
    "docs*",
    "inbox*",
    "logs*",
    "run*",
    "node_modules*",
]

# Non-Python files to include
[tool.setuptools.package-data]
"server" = ["*.yaml", "*.json", "*.txt", "*.md"]
"core" = ["*.yaml", "*.json"]

[tool.setuptools.data-files]
"share/nexus" = [
    "nexus.yaml",
    "requirements.txt",
    "README.md",
    "supervisord.conf",
]

# Black formatting
[tool.black]
line-length = 100
target-version = ["py311"]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
